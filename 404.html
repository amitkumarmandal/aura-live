<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./">
    <title>Redirecting to Aura Live...</title>
    <script>
        // Redirect SPA routing preserving search parameters
        const currentSearch = window.location.search;
        const currentHash = window.location.hash;
        window.location.replace('./' + currentSearch + currentHash);
    </script>
</head>
<body>
    <p>Redirecting to <a href="./">Aura Live</a>...</p>
</body>
</html>
